name: 작업 요청
description: 구현, 개선 또는 운영 작업을 제안합니다.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        작업 범위와 완료 조건을 작성해주세요.
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 이 작업으로 달성할 결과를 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 문제 또는 배경
      description: 현재 문제와 작업이 필요한 이유를 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 필요한 구현 또는 변경을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 작업에서 변경할 영역을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 작업 제외 범위
      description: 이번 작업에서 다루지 않을 영역을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: design-impact
    attributes:
      label: 설계 영향
      description: Public API, ownership, lifecycle, concurrency 또는 dependency 영향이 있다면 작성해주세요.
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 확인 가능한 완료 조건을 목록으로 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: build, test, lint 또는 수동 확인 방법을 작성해주세요.
    validations:
      required: true
