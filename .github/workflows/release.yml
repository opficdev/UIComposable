name: Release Swift Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic Version without a prefix, for example 1.0.0
        required: true
        type: string
      release_notes:
        description: Release notes
        required: false
        type: string

concurrency:
  group: release-swift-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse "$GITHUB_SHA^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use semantic versioning such as 1.0.0" >&2
            exit 1
          fi

      - name: Ensure tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists locally: $VERSION" >&2
            exit 1
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]]; then
            echo "Tag already exists on origin: $VERSION" >&2
            exit 1
          fi

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Create and push verified tag
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$COMMIT_SHA" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Verify pushed tag
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_revision="$(git ls-remote --tags origin "refs/tags/$VERSION^{}" | awk '{print $1}')"
          if [[ "$remote_revision" != "$COMMIT_SHA" ]]; then
            echo "Pushed tag does not point to the verified commit" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.VERSION,
              target_commitish: process.env.COMMIT_SHA,
              name: process.env.VERSION,
              body: process.env.RELEASE_NOTES || undefined,
              generate_release_notes: !process.env.RELEASE_NOTES,
            });
            if (release.data.draft || !release.data.html_url) {
              throw new Error("GitHub Release publication failed");
            }
