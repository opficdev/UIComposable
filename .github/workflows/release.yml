name: Release Swift Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic Version without a prefix, for example 1.0.0
        required: true
        type: string
      release_notes:
        description: Release notes
        required: false
        type: string

concurrency:
  group: release-swift-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse "$GITHUB_SHA^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use semantic versioning such as 1.0.0" >&2
            exit 1
          fi

      - name: Validate existing remote tag
        id: tag
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_revision="$(git ls-remote --tags origin "refs/tags/$VERSION^{}" | awk '{print $1}')"
          if [[ -z "$remote_revision" ]]; then
            remote_revision="$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')"
          fi
          if [[ -z "$remote_revision" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$remote_revision" != "$COMMIT_SHA" ]]; then
            echo "Existing tag does not point to the verified commit" >&2
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild \
            -scheme UIComposable \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Resolve iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bash Scripts/resolve-ios-simulator.sh > simulator.log 2>&1
          status=$?
          set -e
          cat simulator.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          simulator_id="$(tail -n 1 simulator.log)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild \
            -scheme UIComposable \
            -sdk iphonesimulator \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/UIComposableDerivedData" \
            test

      - name: Verify compile-fail contracts
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/verify-compile-fail-contracts.sh \
            "$RUNNER_TEMP/UIComposableDerivedData/Build/Products/Debug-iphonesimulator"

      - name: Verify remote consumer by revision
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/verify-uicomposable-consumer.sh \
            revision "$COMMIT_SHA" "$COMMIT_SHA"

      - name: Create or reuse verified tag
        if: steps.tag.outputs.exists == 'false'
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$COMMIT_SHA" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Verify pushed tag
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_revision="$(git ls-remote --tags origin "refs/tags/$VERSION^{}" | awk '{print $1}')"
          if [[ -z "$remote_revision" ]]; then
            remote_revision="$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')"
          fi
          if [[ "$remote_revision" != "$COMMIT_SHA" ]]; then
            echo "Pushed tag does not point to the verified commit" >&2
            exit 1
          fi

      - name: Create or reuse GitHub Release draft
        id: release_draft
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.VERSION;
            const notes = process.env.RELEASE_NOTES?.trim();
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const existingRelease = releases.find((candidate) => candidate.tag_name === version);
            const release = existingRelease ?? (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: version,
                target_commitish: process.env.COMMIT_SHA,
                name: version,
                body: notes || undefined,
                draft: true,
                generate_release_notes: !notes,
              })).data;

            if (release.tag_name !== version) {
              throw new Error("GitHub Release tag does not match the requested version");
            }
            core.setOutput("release_id", release.id);

      - name: Verify remote consumer by version
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/verify-uicomposable-consumer.sh \
            exact "$VERSION" "$COMMIT_SHA"

      - name: Publish GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release_draft.outputs.release_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.VERSION;
            const releaseID = Number(process.env.RELEASE_ID);
            if (!Number.isInteger(releaseID)) {
              throw new Error("GitHub Release identifier is unavailable");
            }

            const release = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseID,
              draft: false,
            });
            if (release.data.tag_name !== version || release.data.draft || !release.data.html_url) {
              throw new Error("GitHub Release publication failed");
            }
