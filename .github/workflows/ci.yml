name: Swift Package CI

on:
  pull_request:

concurrency:
  group: swift-package-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Swift Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme UIComposable \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error

  test:
    name: Swift Test
    needs: build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme UIComposable \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            test 2>&1 | tee test.log

      - name: Verify compile-fail contracts
        shell: bash
        run: |
          set -euo pipefail
          built_products_directory="$(
            xcodebuild \
              -scheme UIComposable \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -showBuildSettings | awk -F ' = ' '/BUILT_PRODUCTS_DIR/ { print $2; exit }'
          )"
          bash Scripts/verify-compile-fail-contracts.sh "$built_products_directory"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: error
