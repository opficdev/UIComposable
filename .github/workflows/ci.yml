name: Swift Package CI

on:
  pull_request:

concurrency:
  group: swift-package-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Swift Build
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme UIComposable \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: error

  test:
    name: Swift Test
    needs: build
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          echo "id=$(bash Scripts/resolve-ios-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -scheme UIComposable \
            -sdk iphonesimulator \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/UIComposableDerivedData" \
            test 2>&1 | tee test.log

      - name: Verify compile-fail contracts
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/verify-compile-fail-contracts.sh \
            "$RUNNER_TEMP/UIComposableDerivedData/Build/Products/Debug-iphonesimulator"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: test.log
          if-no-files-found: error
